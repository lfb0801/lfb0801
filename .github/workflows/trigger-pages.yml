name: Trigger root GitHub Pages deploy

# The root site (lfb0801.github.io) builds this repo from its own workflow,
# which does not run when this repo changes. Kick it off after every push.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Run publish workflow in lfb0801.github.io
        env:
          GH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
        run: gh workflow run publish.yml --repo lfb0801/lfb0801.github.io --ref master
