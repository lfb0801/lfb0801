<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b0d">
    <meta
      name="description"
      content="Lloyd van Zaalen's terminal garden: ideas, case studies, and notes on making engineering reasoning visible."
    >
    <link rel="canonical" href="https://lfb0801.github.io/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lfb0801.github.io/">
    <meta property="og:title" content="Lloyd van Zaalen — Terminal Garden">
    <meta
      property="og:description"
      content="A read-only terminal garden for engineering ideas, decisions, and case studies."
    >
    <meta property="og:image" content="https://lfb0801.github.io/og.png">
    <meta
      property="og:image:alt"
      content="A dark split-screen terminal typing show README.md beside the title Terminal Garden."
    >
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lloyd van Zaalen — Terminal Garden">
    <meta
      name="twitter:description"
      content="A read-only terminal garden for engineering ideas, decisions, and case studies."
    >
    <meta name="twitter:image" content="https://lfb0801.github.io/og.png">
    <title>Lloyd van Zaalen — terminal garden</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#document">Skip to the current document</a>

    <main class="site-shell" aria-label="Lloyd van Zaalen's terminal garden">
      <section class="workspace" id="workspace">
        <section class="terminal panel" id="terminal" aria-label="Interactive portfolio terminal">
          <header class="window-bar">
            <div class="window-controls" aria-hidden="true">
              <span class="window-control close"></span>
              <span class="window-control minimise"></span>
              <span class="window-control maximise"></span>
            </div>
            <p class="window-title">
              <span class="terminal-mark" aria-hidden="true">›_</span>
              lloyd@garden
            </p>
            <p class="sandbox-status"><span aria-hidden="true"></span> sandboxed</p>
          </header>

          <div class="terminal-body">
            <div
              class="terminal-output"
              id="terminal-output"
              role="log"
              aria-live="polite"
              aria-label="Terminal output"
            ></div>

            <form class="command-form" id="command-form" autocomplete="off">
              <label class="sr-only" for="command-input">Enter a portfolio command</label>
              <span class="prompt-user" aria-hidden="true">lloyd</span>
              <span class="prompt-separator" aria-hidden="true">@</span>
              <span class="prompt-host" aria-hidden="true">garden</span>
              <span class="prompt-path" id="prompt-path" aria-hidden="true">~</span>
              <span class="prompt-symbol" aria-hidden="true">❯</span>
              <input
                id="command-input"
                name="command"
                inputmode="text"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                aria-describedby="terminal-hint"
              >
            </form>
          </div>

          <footer class="terminal-footer" id="terminal-hint">
            <span><kbd>tab</kbd> complete</span>
            <span><kbd>↑</kbd><kbd>↓</kbd> history</span>
            <span><kbd>ctrl</kbd>+<kbd>l</kbd> clear</span>
          </footer>
        </section>

        <section class="reader panel" id="reader" aria-hidden="true">
          <header class="reader-bar">
            <p class="reader-path">
              <span aria-hidden="true">󰈙</span>
              <span id="reader-path">~/README.md</span>
            </p>
            <div class="reader-meta">
              <span>markdown</span>
              <span class="reader-saved"><i aria-hidden="true"></i> read only</span>
            </div>
          </header>

          <article class="document" id="document" tabindex="-1"></article>
          <div class="reader-corner" aria-hidden="true">MD</div>
        </section>
      </section>

      <noscript>
        <p class="noscript">
          This garden needs JavaScript for its terminal.
          <a href="https://github.com/lfb0801">Visit Lloyd on GitHub instead.</a>
        </p>
      </noscript>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
